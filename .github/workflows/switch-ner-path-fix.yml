name: Switch Ner Tamid preview path
on:
  push:
    branches: [site-upgrade]
    paths:
      - '.github/workflows/switch-ner-path-fix.yml'
permissions:
  contents: write
jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-upgrade
      - run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('index.html','preview.html'):
              p=Path(name)
              s=p.read_text().replace('assets/live-layer-0239.js','assets/live-layer-0245.js')
              p.write_text(s)
          PY
          rm -f .github/workflows/switch-ner-path-fix.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html preview.html .github/workflows/switch-ner-path-fix.yml
          git commit -m 'Use corrected Ner Tamid preview asset path'
          git push origin site-upgrade
