name: Apply visual refinement

on:
  push:
    branches: [site-upgrade]
    paths:
      - '.github/workflows/apply-visual-refinement.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-upgrade
      - name: Wire new gallery and Ner Tamid assets
        shell: python
        run: |
          from pathlib import Path

          files = [Path('index.html'), Path('preview.html')]
          for p in files:
              s = p.read_text()
              s = s.replace('assets/live-layer-6e2c839.js', 'assets/live-layer-0215.js')
              if 'refinements-0215.css' not in s:
                  if p.name == 'preview.html':
                      old = '<link rel="stylesheet" href="https://raw.githack.com/annaraeokay/annaraeart/site-upgrade/assets/site-upgrade.css"/>'
                      new = old + '\n<link rel="stylesheet" href="https://raw.githack.com/annaraeokay/annaraeart/site-upgrade/assets/refinements-0215.css"/>'
                  else:
                      old = '<link rel="stylesheet" href="/assets/site-upgrade.css"/>'
                      new = old + '\n<link rel="stylesheet" href="/assets/refinements-0215.css"/>'
                  if old not in s:
                      raise SystemExit(f'Could not find site-upgrade stylesheet link in {p}')
                  s = s.replace(old, new, 1)
              p.write_text(s)
      - name: Clean workflow and commit
        run: |
          git rm .github/workflows/apply-visual-refinement.yml
          git add index.html preview.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refine Chicago grid and Ner Tamid typography"
          git push origin HEAD:site-upgrade
