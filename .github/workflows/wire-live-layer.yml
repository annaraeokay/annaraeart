name: Wire live homepage layer

on:
  push:
    branches:
      - site-upgrade
    paths:
      - '.github/workflows/wire-live-layer.yml'

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site-upgrade
        uses: actions/checkout@v4
        with:
          ref: site-upgrade

      - name: Add live layer script to homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script defer src="/assets/live-layer.js"></script>'
          if tag not in text:
              if '</body>' in text:
                  text = text.replace('</body>', tag + '</body>', 1)
              else:
                  text += tag
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage live layer wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Wire Today and Parsha layer into homepage"
            git push origin HEAD:site-upgrade
          fi
