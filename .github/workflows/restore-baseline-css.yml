name: Restore baseline stylesheet

on:
  push:
    paths:
      - '.github/workflows/restore-baseline-css.yml'

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild stylesheet from original ZIP data
        shell: bash
        run: |
          set -euo pipefail
          cat .snapshot-gz/part*.b64 | base64 --decode > /tmp/index.css.gz
          mkdir -p assets
          gzip -dc /tmp/index.css.gz > assets/index-EKRdpO1a.css
          echo 'a15451766886d7cd2d939169b437158cd14ed3cfd8f401b130c10983cc949103  assets/index-EKRdpO1a.css' | sha256sum -c -

      - name: Finalize clean baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .snapshot-css .snapshot-gz
          rm -f .github/workflows/snapshot-art-assets.yml
          rm -f .github/workflows/snapshot-site-files.yml
          rm -f .github/workflows/restore-baseline-css.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete baseline site snapshot'
          git push
